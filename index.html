<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeadIntel — verified owner-level B2B lead intelligence for local-service trades." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>LeadIntel — Lead Intelligence Platform</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Dark is the default brand.
      try {
        var s = JSON.parse(localStorage.getItem('leadintel-ui') || '{}');
        var t = (s && s.state && s.state.theme) || 'dark';
        var dark = t !== 'light';
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.background = dark ? '#0b0c10' : '#f8fafc';
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.background = '#0b0c10';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
