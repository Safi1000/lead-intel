                      - list [ref=e541]:
                        - generic [ref=e542]:
                          - listitem [ref=e543]:
                            - generic [ref=e544]:
                              - generic:
                                - generic:
                                  - paragraph [ref=e548]: "1"
                                  - heading "What makes ERT Cosmetic Clinic different from other cosmetic clinics?" [level=6] [ref=e549]
                                  - paragraph [ref=e550]: ERT Cosmetic Clinic combines advanced medical technology, experienced medical professionals, and personalized treatment planning in a luxury clinical environment. Rather than recommending the same treatment for every patient, we evaluate your skin quality, facial anatomy, lifestyle, and aesthetic goals to create a customized treatment plan. Our philosophy is to achieve natural-looking results that enhance your existing features while supporting long-term skin health.
                          - listitem [ref=e552]:
                            - generic [ref=e553]:
                              - generic:
                                - generic:
                                  - paragraph [ref=e557]: "2"
                                  - heading "Why do many clients choose ERT Cosmetic Clinic?" [level=6] [ref=e558]
                                  - paragraph [ref=e559]: Many clients choose ERT Cosmetic Clinic because we provide a comprehensive, personalized approach to medical aesthetics rather than focusing on a single treatment or device. Our clinic combines advanced technologies, including Ultherapy Prime, Thermage, Fotona, PicoWay, BBL HEROic, MOXI, Potenza RF Microneedling, and injectable treatments, with medical-grade skincare SkinCeuticals and Skinbetter, as well as an exclusive collection of world-renowned luxury skincare brands, including Valmont, Biologique Recherche, Swiss Perfection, and Cellcosmet. Every treatment plan is customized based on your skin condition, facial anatomy, lifestyle, and aesthetic goals. By offering a broad range of clinically proven technologies and premium skincare, we can recommend the treatment or combination of treatments that is most appropriate for you, helping achieve natural-looking results while supporting healthy, beautiful skin for years to come.
                          - listitem [ref=e561]:
                            - generic [ref=e562]:
                              - generic:
                                - generic:
                                  - paragraph [ref=e566]: "5"
                                  - heading "Are treatment plans customized?" [level=6] [ref=e567]
                                  - paragraph [ref=e568]: Yes. Every consultation begins with an assessment of your skin condition, medical history, aesthetic goals, and lifestyle. Your practitioner will discuss suitable options, expected results, downtime, maintenance requirements, and any limitations so you can make an informed decision. No two treatment plans are exactly alike.
                          - listitem [ref=e570]:
                            - generic [ref=e571]:
                              - generic:
                                - generic:
                                  - paragraph [ref=e575]: "6"
                                  - heading "Who performs treatments at ERT?" [level=6] [ref=e576]
                                  - paragraph [ref=e577]: Treatments are performed by experienced physicians, registered nurses, and certified medical aesthetic professionals, depending on the procedure. Injectable treatments are performed by qualified medical professionals, while all team members receive ongoing education and training to stay current with evolving techniques and technologies.
                          - listitem [ref=e579]:
                            - generic [ref=e580]:
                              - generic:
                                - generic:
                                  - paragraph [ref=e584]: "7"
                                  - heading "Does ERT focus on natural-looking results?" [level=6] [ref=e585]
                                  - paragraph [ref=e586]: Yes. Our treatment philosophy emphasizes balanced, natural-looking enhancement. Rather than dramatically changing your appearance, we aim to refresh, restore, and enhance your features while preserving facial harmony and individual characteristics.
                          - listitem [ref=e588]:
                            - generic [ref=e589]:
                              - generic:
                                - generic:
                                  - paragraph [ref=e593]: "9"
                                  - heading "Do I need a consultation before treatment?" [level=6] [ref=e594]
                                  - paragraph [ref=e595]: For most medical aesthetic procedures, yes. A consultation allows your practitioner to assess your concerns, review your medical history, discuss available treatment options, explain expected outcomes, and answer your questions before treatment begins.
