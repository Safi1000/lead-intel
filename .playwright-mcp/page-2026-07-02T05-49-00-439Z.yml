          - generic [ref=f102e477]:
            - paragraph [ref=f102e478]: Paige is a Master Aesthetician with over six years of experience specializing in advanced skincare and corrective treatments. Originally from Washington, Paige is excited to return home after spending the last seven years in Gilbert, Arizona. Known for her attention to detail and results-driven approach, Paige creates a safe and welcoming environment that delivers results.
            - paragraph [ref=f102e479]: Having struggled with acne for many years, Paige’s love for skincare began when she experienced firsthand the transformative impact that professional-grade products and treatments can have on skin health and confidence.
            - paragraph [ref=f102e480]: “My goal is to build and restore confidence in my clients while achieving healthy, glowing skin.” - Paige
