        - generic [ref=f102e402]:
          - heading "Meet our team" [level=2] [ref=f102e408]
          - paragraph [ref=f102e414]: Our team brings years of medical aesthetic experience from across the US. We pride ourselves in remaining on the cutting edge of medical aesthetic services, devices, products, and techniques to ensure our clients get the best outcomes. We hope to meet you soon!
          - img "Deb Tri, APRN - Medical Aesthetic Injector, Advanced Practice Nurse Practitioner" [ref=f102e423]
          - heading "Deb" [level=2] [ref=f102e430]
          - heading "Founder, ARNP" [level=4] [ref=f102e436]
          - generic [ref=f102e441]:
            - paragraph [ref=f102e442]: Deb received her master’s in nursing at the University of Washington in 1988 and practiced as a Family Nurse Practitioner for over 18 years before transitioning to Aesthetics.
            - paragraph [ref=f102e443]: As founder of Simplicity Med Spa, Deb is known for her light touch and exceptional results. She has earned respect across the aesthetics industry for her advanced injection techniques, dermal fillers, and non-surgical skin rejuvenation. A recognized expert in the Pacific Northwest, Deb is a key opinion leader in Vampire Facelift and PRP treatments. She remains committed to advanced training and staying at the forefront of aesthetic medicine.
            - paragraph [ref=f102e444]: “I like to make my clients look as good as they feel, vibrant, active, and renewed. Simply to look and feel their best.” - Deb
