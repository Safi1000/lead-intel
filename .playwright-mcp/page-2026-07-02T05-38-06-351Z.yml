              - generic [ref=f1e202]:
                - generic [ref=f1e204]: Right from the moment I stepped in, I could tell I was in expert hands. No Filter stands out as the most stunning MedSpa I've ever visited. Their dedication to precision is truly unmatched. I was greeted by their sweet receptionist and was seen by the laser technician within minutes. The tech listened to my concerns and was very attentive. About a week after my IPL my skin completely transformed. All my hyperpigmentation is gone. My skin looks better than it did when I was a teen. Thank you to the incredible No Filter team. I’m so happy with my results.
                - generic [ref=f1e207]: "- Bar"
            - group [ref=f1e208]:
              - generic [ref=f1e209]:
                - generic [ref=f1e211]: The best medspa in MIAMI !! Very welcoming beautiful and well equipped with the top on the line esthetic machines location. they offers complimentary consults, which was very nice. The nurse that administered my botox injections was great and super professional Not even one single bruise! And Very minimal facial discomfort. Loving the results post treatment. My face looks so much better now !!
                - generic [ref=f1e214]: "- L. T."
            - group [ref=f1e215]:
              - generic [ref=f1e216]:
                - generic [ref=f1e218]: I had an incredible time at the med spa! From the moment I walked into the med spa, I was greeted with warm smiles and friendly faces. The staff was incredibly attentive and there was no wait time at all. Everyone was super friendly and made me feel comfortable throughout my laser treatment. The procedure was quick and virtually painless. My skin feels so smooth and refreshed! I highly recommend this med spa for anyone looking for top-notch service and effective laser treatments.
                - generic [ref=f1e221]: "- C. S"
            - group [ref=f1e222]:
              - generic [ref=f1e223]:
                - generic [ref=f1e225]: I had an amazing experience at No Filter! From the moment I walked in, the staff made me feel comfortable and well-cared for. The facility is modern and inviting. I received Botox treatment, and the results are fantastic – natural and exactly what I wanted. The medical team was highly skilled and attentive, addressing all my concerns and explaining the process thoroughly.The post-treatment care instructions were clear, and I appreciated the follow-up to ensure everything was going well.I love the results and will definitely be returning for more treatments. I highly recommend No Filter to anyone looking for exceptional cosmetic procedures!
                - generic [ref=f1e228]: "- C. A."
            - group [ref=f1e229]:
              - generic [ref=f1e230]:
                - generic [ref=f1e232]: 10/10 recommend! I received kybella yesterday. I am so happy with the experience, it is so important to me. Do you want to be wowed? Let’s begin with how amazing the spa is with all the services that it provides! High Quality products and top notch staff! The owner and his staff are passionate about beauty and health. Your well-being is their top priority. The entire staff is extremely knowledgeable, professional, and absolutely talented too! I’m obsessed with NoFilterSpa! Thank you for everything! I will be back soon.
                - generic [ref=f1e235]: "- C. G."
            - group [ref=f1e236]:
              - generic [ref=f1e237]:
                - generic [ref=f1e239]: I had an absolutely amazing experience at this medical spa! From the moment I walked in, I was impressed by the professionalism and expertise of the staff. The techniques they used for my treatments were top-notch, and the results were fantastic.The spa itself is stunning and impeccably clean. It's the kind of place that you just want to spend the whole day in, relaxing and pampering yourself.I went in for botox and filler, and the results were beyond my expectations. My brother and husband also decided to try some treatments - laser and botox, and they were equally thrilled with the results.In short, this place is nothing short of magical. I highly recommend it to anyone looking for a top-notch medical spa experience. I can't wait to go back!
                - generic [ref=f1e242]: "- J. O."
