          - heading "Get to Know Dr. Kian Karimi" [level=1] [ref=f1e152]
          - paragraph [ref=f1e158]:
            - strong [ref=f1e159]:
              - emphasis [ref=f1e160]:
                - text: Dr. Kian Karimi, MD, FACS
                - text: Founder & Medical Director, Kian Aesthetic Institute & Expert Facial Plastic Surgeon in Los Angeles
          - generic [ref=f1e165]:
            - paragraph [ref=f1e166]: Dr. Kian Karimi is a double board-certified facial plastic and reconstructive surgeon and the founder of the Kian Aesthetic Institute in Los Angeles. Recognized nationally and internationally for his artistry and innovative techniques, Dr. Karimi specializes in rhinoplasty, deep plane facelifts, and advanced minimally invasive facial rejuvenation.
            - paragraph [ref=f1e167]: With more than 15 years of surgical experience, Dr. Karimi has become a trusted leader in aesthetics, frequently sought after by media outlets and invited to lecture and train providers across the world. As co-founder and course chairman of the Los Angeles Multi-Specialty Cosmetic Academy, he has trained thousands of physicians and medical professionals in the latest aesthetic techniques.
            - paragraph [ref=f1e168]: Dr. Karimi’s commitment to excellence has earned him repeated recognition as a “Top Doctor” and “Southern California Super Doctor,” along with Castle Connolly awards in Facial Plastic Surgery. He has published extensively in peer-reviewed journals, contributed to major textbooks in facial plastic surgery, and serves as a key opinion leader and researcher for leading aesthetic companies.
            - paragraph [ref=f1e169]: Beyond his surgical expertise, Dr. Karimi is passionate about advancing the field of regenerative aesthetics, integrating novel therapies such as platelet-rich fibrin (PRF), EZGEL, and thread lifting into modern facial rejuvenation. His philosophy combines science, artistry, and compassion to deliver natural, transformative results tailored to each patient’s unique goals.
            - paragraph [ref=f1e170]: At Kian Aesthetic Institute, Dr. Karimi leads a team dedicated to excellence in surgical and non-surgical facial aesthetics, setting the standard for innovation, safety, and patient-centered care.
