                - generic [ref=f103e360]:
                  - paragraph [ref=f103e362]:
                    - text: From psoriasis to eczema, acne, skin cancer and skin allergy— diseases and ailments of the skin require medical expertise, understanding, care, compassion and respect in order to safely and effectively treat a patient. At Las Vegas Dermatology
                    - superscript [ref=f103e363]: ®
                    - text: ", our team of medical professionals and skin care experts include Board Certified Dermatologists and Aestheticians with the experience and knowledge required to help our patients achieve a healthier and more beautiful life."
                  - link "SCHEDULE AN APPOINTMENT" [ref=f103e365] [cursor=pointer]:
                    - /url: /contact/
                - paragraph [ref=f103e372]:
                  - text: With over fifty-thousand patients served across Nevada, the United States and world, Las Vegas Dermatology
                  - superscript [ref=f103e373]: ®
                  - text: is able to leverage the extensive medical experience of our entire staff against the problems, challenges and concerns of our patients. Utilizing the industry’s most cutting-edge and innovative technologies, we are able to customize an effective patient treatment plan. Whether treating a challenging skin disease or enhancing beauty through injectables, fillers and skin pampering, you’re in safe hands at Las Vegas Dermatology
                  - superscript [ref=f103e374]: ®
