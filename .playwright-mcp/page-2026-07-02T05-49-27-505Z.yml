              - heading "Our dedicated team advocates and embraces Las Vegas' toughest and most concerning challenges in Dermatologic health & skin care." [level=3] [ref=f103e350]:
                - generic [ref=f103e351]: Our dedicated team advocates and embraces Las Vegas' toughest and most concerning challenges in Dermatologic health & skin care.
