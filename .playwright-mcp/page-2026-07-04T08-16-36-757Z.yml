            - generic:  
            - generic [ref=f44e143]:
              - paragraph [ref=f44e144]: Technically known as retention hyperkeratosis, acne is a chronic inflammatory condition of the pilosebaceous (hair follicle and its sebaceous gland). It is characterized by comedones (blackheads), macules (discoloured spots), papules (inflammatory elevation of skin not containing pus), pustules, cysts, and scars.
              - paragraph [ref=f44e145]: There is no single cause for oily and acne-prone skin. Acne can be a genetic condition or caused by external factors. Common contributing factors to acne include Hormonal fluctuations, stress, medication, climatic conditions, drugs, cosmetic ingredients that irritate the skin and clog pores, and hereditary conditions.
