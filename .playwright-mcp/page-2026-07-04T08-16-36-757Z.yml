          - heading "“10/10 experience with Vanity Skin Clinic!! My skin has never looked better!”" [level=3] [ref=f44e218]
          - paragraph [ref=f44e219]: My skin would not stop breaking out! I had tried multiple products before, trying to clear up my skin. Nothing worked for me! Danika was unbelievable! She was able to answer all of my questions, and she found a solution for my skin!! She was extremely knowledgeable and professional as well as welcoming and friendly! Won’t go anywhere else! Not to mention my skin has never looked better!
