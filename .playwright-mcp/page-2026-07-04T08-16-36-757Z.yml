          - heading "Meet Clinical Director & Acne Specialist" [level=2] [ref=f44e189]
          - paragraph [ref=f44e190]: Hi, I'm Danika, a paramedical skin therapist specializing in acne and invested in your skin health. I have been in your shoes and suffered from stubborn acne myself and can sympathize with anyone going through the same mental and physical struggle.
          - paragraph [ref=f44e191]: Now, I help women like you clear their skin and heal from acne through a holistic approach so you can regain control back in your life and live confidently. Because when we feel like ourselves, that’s when we flourish the most.
        - link "More About Danika" [ref=f44e196] [cursor=pointer]:
