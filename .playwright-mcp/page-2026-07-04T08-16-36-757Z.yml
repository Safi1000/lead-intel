        - generic [ref=f44e100]:
          - heading "Welcome to Vanity Skin Clinic, where your skin is our priority." [level=2] [ref=f44e101]
          - paragraph [ref=f44e102]:
            - text: You deserve to shine in your natural beauty, which is why we believe there is no
            - emphasis [ref=f44e103]: "\"one size fits all\""
            - text: solution when it comes to skincare. Using a combination of professional clinic treatments and prescribed skincare products, we take a holistic approach to improve your skin’s health, from the inside out.
          - paragraph [ref=f44e104]: Together, we will design a treatment program that is ideal for your skin and lifestyle.
