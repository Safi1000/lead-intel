        - heading "Welcome to Advanced Aesthetics" [level=2] [ref=f68e446]:
          - text: Welcome to
          - text: Advanced Aesthetics
        - paragraph [ref=f68e447]: For 20 years, Advanced Aesthetics has been Las Vegas/Henderson’s premier destination for aesthetic excellence, with five fabulous locations across the Las Vegas Valley (three!), Dallas, and San Diego. Led by Board-Certified Plastic Surgeons Dr. Tracy Hankins and Dr. Samuel Sohn with over 40 years of combined experience, our team of nine expert injectors and advanced aestheticians delivers world-class results to clients from around the globe. From your first “hello” consultation to your post-procedure glow-up check-ins, we’ve created the most welcoming, comfortable space where you can relax and let us work our magic.
        - blockquote [ref=f68e448]:
          - paragraph [ref=f68e449]: "Fun fact: we’re one of Allergan’s (the creators of Botox) top five nationwide clients, which means we score amazing prices that we happily pass on to you. Plus, we’ve got the region’s most comprehensive selection of laser treatments, peels, and skincare services you could dream of – because why settle for ordinary when you can be extraordinary?"
