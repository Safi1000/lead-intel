            - paragraph [ref=f68e521]:
              - text: “Advanced Aesthetics is the go-to place if you’re looking for the best in laser treatments, injectables, and even hormone therapy. I’ve experienced all of these services here and absolutely love my results.
              - text: They’re true professionals and incredibly skilled. You won’t find better care than at Advanced Aesthetics!”
          - generic [ref=f68e522]:
            - img [ref=f68e523]
            - paragraph [ref=f68e526]: “I had a wonderful experience during my first Botox treatment here. I came on a friend’s recommendation and couldn’t be happier. Dr. Linda performed the procedure, and everything went smoothly. The staff was kind and professional, and the space itself was beautiful. I just had the treatment yesterday, so I’m still waiting to see the full results—but I’m confident they’ll be fantastic.”
          - generic [ref=f68e527]:
            - img [ref=f68e528]
            - paragraph [ref=f68e531]: “I love this place! Everyone here is so friendly and it doesn’t feel stuck up like some med spas I’ve been to in the past. Every treatment I’ve had has been great. I saw Sarah for Xeomin last month and she did such a great job. I’ve also had an Ipl laser treatment done which made my skin glow. I look forward to getting many more treatments done here in the future.”
